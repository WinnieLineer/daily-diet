<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Diet - 精美模板回信小助手 🐼💌</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "微軟正黑體", sans-serif;
      background: #F4F4F5;
      margin: 0;
      padding: 24px 16px;
      color: #18181B;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 800px;
      width: 100%;
    }
    .panel {
      background: #FFFFFF;
      border: 3px solid #000000;
      border-radius: 24px;
      box-shadow: 6px 6px 0px #000000;
      padding: 24px;
      margin-bottom: 24px;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      background: #000000;
      color: #FDE047;
      font-weight: 900;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      margin: 4px 0 0 0;
      font-size: 24px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.5px;
    }
    .grid-tmpl {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .tmpl-btn {
      padding: 12px 14px;
      border: 2px solid #000000;
      border-radius: 16px;
      background: #FAFAFA;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      font-size: 13px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    .tmpl-btn:hover {
      background: #F4F4F5;
      transform: translateY(-2px);
      box-shadow: 3px 3px 0px #000000;
    }
    .tmpl-btn.active {
      background: #000000;
      color: #FFFFFF;
      box-shadow: 3px 3px 0px #FDE047;
    }
    .tmpl-btn .sub {
      font-size: 10px;
      font-weight: bold;
      opacity: 0.7;
    }
    .tmpl-btn.active .sub {
      color: #FDE047;
      opacity: 1;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      background: #F9FAFB;
      border: 2px solid #000000;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group.full {
      grid-column: 1 / -1;
    }
    label {
      font-size: 12px;
      font-weight: 800;
      color: #4B5563;
    }
    input, textarea {
      padding: 10px 12px;
      border: 2px solid #000000;
      border-radius: 12px;
      font-size: 13px;
      font-family: inherit;
      background: #FFFFFF;
    }
    input:focus, textarea:focus {
      outline: none;
      background: #FFFBEB;
    }
    .action-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }
    .btn {
      padding: 12px 20px;
      border: 2px solid #000000;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0px #000000;
    }
    .btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #000000;
    }
    .btn-copy {
      background: #FDE047;
      color: #000000;
    }
    .btn-gmail {
      background: #EA4335;
      color: #FFFFFF;
    }
    .btn-secondary {
      background: #FFFFFF;
      color: #18181B;
    }
    .toast {
      display: none;
      background: #DCFCE7;
      border: 2px solid #16A34A;
      color: #166534;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 12px;
      text-align: center;
    }
    .preview-box {
      border: 2px dashed #A1A1AA;
      border-radius: 18px;
      padding: 20px;
      background: #FAFAFA;
      margin-top: 16px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="panel">
    <div class="header-bar">
      <div>
        <span class="badge">VIP Reply Generator</span>
        <h1>🐼 Daily Diet 精美模板回信小助手</h1>
      </div>
      <a href="./" class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">
        🏠 返回首頁
      </a>
    </div>

    <!-- 模板選擇器 -->
    <div class="grid-tmpl">
      <button class="tmpl-btn active" onclick="switchTemplate('sponsor')">
        <span>🎁 贊助感謝</span>
        <span class="sub">創始支持者尊榮禮遇</span>
      </button>
      <button class="tmpl-btn" onclick="switchTemplate('gist_tech')">
        <span>⚙️ Gist / PAT 技術說明</span>
        <span class="sub">針對 Geek / 同步問題</span>
      </button>
      <button class="tmpl-btn" onclick="switchTemplate('feedback_general')">
        <span>💡 功能反饋致謝</span>
        <span class="sub">感謝回報與建議</span>
      </button>
      <button class="tmpl-btn" onclick="switchTemplate('custom')">
        <span>📝 自訂空白信</span>
        <span class="sub">自由編輯主旨與內文</span>
      </button>
    </div>

    <!-- 編輯欄位 -->
    <div class="form-grid">
      <div class="form-group">
        <label>📧 收件者 Email</label>
        <input type="email" id="recipientEmail" placeholder="例如：user@example.com" oninput="renderPreview()">
      </div>
      <div class="form-group">
        <label>👤 用戶暱稱 / 稱謂</label>
        <input type="text" id="recipientName" placeholder="例如：Jon、Yixian" oninput="renderPreview()">
      </div>
      <div class="form-group full">
        <label>📌 信件主旨</label>
        <input type="text" id="emailSubject" oninput="renderPreview()">
      </div>
      <div class="form-group full">
        <label>💬 引用用戶留言（將置於醒目引言卡片中，選填）</label>
        <textarea id="quoteText" rows="2" placeholder="可貼入用戶在網頁反饋的原始文字..." oninput="renderPreview()"></textarea>
      </div>
      <div class="form-group full">
        <label>✍️ 開頭引言與客製說明</label>
        <textarea id="introText" rows="2" oninput="renderPreview()"></textarea>
      </div>
    </div>

    <!-- 即時預覽標題 -->
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 13px; font-weight: 900; color: #52525B;">
        👁️ 即時外觀預覽（貼到 Gmail 後的真實樣式）：
      </span>
      <span style="font-size: 11px; font-weight: bold; color: #0F766E; background: #CCFBF1; padding: 2px 8px; border-radius: 999px;">
        ✨ 經典高質感卡片排版 & 獨立開發者署名
      </span>
    </div>

    <!-- 預覽容器 -->
    <div class="preview-box" id="previewArea"></div>

    <!-- 底部操作列 -->
    <div class="action-bar">
      <div>
        <button class="btn btn-secondary" onclick="copyPlainText()">
          📄 複製純文字
        </button>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-copy" onclick="copyRichHtml()">
          📋 一鍵複製精美圖文信（推薦貼到 Gmail）
        </button>
        <button class="btn btn-gmail" onclick="openGmail()">
          📮 開啟 Gmail 撰寫新信件
        </button>
      </div>
    </div>
    <div class="toast" id="toast">🎉 精美排版信件已複製！在 Gmail 信件編輯區直接按 Ctrl + V (貼上) 即可！</div>
  </div>
</div>

<script>
  let currentTemplate = 'sponsor';

  const TEMPLATES = {
    sponsor: {
      subject: '感謝您對 Daily Diet 的溫暖鼓勵與支持！🐼🎋（創始支持者登記確認）',
      intro: '今天在後台收到您送出的贊助與支持留言，看到這則訊息時，我真的又驚又喜，內心滿滿的感動！身為獨立開發者，能收到使用者主動說好用、甚至還專程找轉帳資訊想給予支持，這絕對是開發旅程中最珍貴、最強大的強心針與肯定！❤️'
    },
    gist_tech: {
      subject: 'Daily Diet 雲端同步與 GitHub Gist / PAT 設定說明 🐼🛠️',
      intro: '非常感謝您詳細的回饋！看到您提到手動同步與 daily-diet-backup.json，直覺您一定是對技術非常有敏銳度的資深用戶或開發者朋友，非常開心能有您的使用與測試！'
    },
    feedback_general: {
      subject: '非常感謝您對 Daily Diet 的寶貴建議！🐼✨',
      intro: '非常感謝您撥冗填寫意見回饋！每一則來自使用者的真實反饋，都是我們持續優化 Daily Diet 體驗的最重要指南針。'
    },
    custom: {
      subject: '來自 Daily Diet 團隊的問候 🐼',
      intro: '您好！感謝您一直以來對 Daily Diet 的關注與使用。'
    }
  };

  // 初始化 URL 參數
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email') || '';
    const name = params.get('name') || '';
    const tmpl = params.get('template') || 'sponsor';
    const quote = params.get('quote') || '';

    if (email) document.getElementById('recipientEmail').value = email;
    if (name) document.getElementById('recipientName').value = name;
    if (quote) document.getElementById('quoteText').value = quote;

    switchTemplate(tmpl);
  });

  function switchTemplate(tmplId) {
    currentTemplate = tmplId;
    document.querySelectorAll('.tmpl-btn').forEach((btn, idx) => {
      btn.classList.remove('active');
    });
    const btns = document.querySelectorAll('.tmpl-btn');
    if (tmplId === 'sponsor') btns[0].classList.add('active');
    else if (tmplId === 'gist_tech') btns[1].classList.add('active');
    else if (tmplId === 'feedback_general') btns[2].classList.add('active');
    else btns[3].classList.add('active');

    const config = TEMPLATES[tmplId] || TEMPLATES.sponsor;
    document.getElementById('emailSubject').value = config.subject;
    document.getElementById('introText').value = config.intro;

    renderPreview();
  }

  function getFormData() {
    return {
      email: document.getElementById('recipientEmail').value.trim(),
      name: document.getElementById('recipientName').value.trim() || '朋友',
      subject: document.getElementById('emailSubject').value.trim(),
      quote: document.getElementById('quoteText').value.trim(),
      intro: document.getElementById('introText').value.trim()
    };
  }

  function generateHtml() {
    const data = getFormData();
    let quoteHtml = '';
    if (data.quote) {
      quoteHtml = `
        <div style="background-color: #F4F4F5; border-left: 4px solid #FDE047; padding: 12px 16px; margin: 16px 0; border-radius: 4px; font-style: italic; color: #18181B; font-size: 14px;">
          「${data.quote.replace(/\n/g, '<br>')}」
        </div>
      `;
    }

    let headerTitle = data.subject || '感謝您對 Daily Diet 的關注與支持 ✨';
    let closingWish = '再次由衷感謝您的這份心意與鼓勵！有了您的支持，這隻熊貓教練一定會更有活力地繼續陪伴大家！<br><b>祝您飲食紀錄順心、健康生活每一天！🔥🐼</b>';
    let bodyHtml = '';

    if (currentTemplate === 'sponsor') {
      headerTitle = '感謝您對 Daily Diet 的溫暖鼓勵與支持 ✨';
      closingWish = '再次由衷感謝您的這份心意與鼓勵！有了您的支持，這隻熊貓教練一定會更有活力地繼續陪伴大家！<br><b>祝您飲食紀錄順心、健康生活每一天！🔥🐼</b>';
      bodyHtml = `
        <!-- 區塊 1: 為什麼之前把轉帳資料藏起來？ -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #FEF9C3; border: 2px solid #000000; border-radius: 14px; margin-bottom: 24px;">
          <tr>
            <td style="padding: 20px;">
              <div style="font-size: 16px; font-weight: bold; color: #713F12; margin-bottom: 8px;">
                🎋 為什麼之前把轉帳資料藏起來？
              </div>
              <p style="font-size: 14px; color: #854D0E; margin: 0 0 12px 0; line-height: 1.6;">
                先跟您坦白之前隱藏的原因：我不希望這個工具給人一種「在急著商業變現」的感覺。Daily Diet 的初衷是打造一個乾淨無廣告、無干擾的健康陪伴工具。<br>
                不過，每位用戶每次拍照記餐、呼叫 Gemini AI 進行視覺營養分析，背後確實都有真實的<b>雲端伺服器與 AI 算力 Token 成本</b>。因此您的這份微薄心意，對我來說就是最及時、最珍貴的<b>「AI 算力補給燃料」</b>！
              </p>
              <div style="background-color: #FFFFFF; border: 1.5px solid #EAB308; border-radius: 10px; padding: 14px; font-size: 14px; color: #000000; line-height: 1.6;">
                🎁 <b>老朋友專屬【創始支持者】禮遇 🎋✨：</b><br>
                因為有像您這樣一路相伴、真心認同理念的老朋友，只要您透過官方管道完成支持與回報，我會直接將您的信箱（<b>${data.email || '您的信箱'}</b>）登記在系統核心的【創始支持者 (Founder Supporter)】名冊中：<br>
                • 🎖️ <b>永久享有個人專屬「創始支持者金色徽章」</b><br>
                • 🚀 <b>未來任何全新 AI 增強功能推出時，享有第一優先免費內測權與老友專屬禮遇</b><br>
                感謝您在草創期拉我一把，成為 Daily Diet 的堅實後盾！❤️
              </div>
            </td>
          </tr>
        </table>

        <!-- 區塊 2: 統一贊助與匯款資訊取得管道 -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #F0FDFA; border: 2px solid #000000; border-radius: 14px; margin-bottom: 24px;">
          <tr>
            <td style="padding: 22px;">
              <div style="font-size: 16px; font-weight: bold; color: #0F766E; margin-bottom: 12px;">
                💳 匯款與贊助資訊取得方式（統一官方管道）
              </div>
              <p style="font-size: 14px; color: #134E4A; margin: 0 0 16px 0; line-height: 1.6;">
                為了保護資訊安全、確保資訊隨時保持最新，並能讓系統<b>自動為您的帳號即時對帳與點亮金色創始徽章</b>，我們統一將匯款資訊與末 5 碼登記整合在官方網頁與 LINE 官方帳號中，不再於信件中直接附上個人帳號。請您透過以下任一管道獲取：
              </p>

              <!-- 管道 1: 網頁版 -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #FFFFFF; border: 1.5px solid #5EEAD4; border-radius: 12px; margin-bottom: 14px;">
                <tr>
                  <td style="padding: 16px;">
                    <div style="font-size: 15px; font-weight: bold; color: #0F766E; margin-bottom: 6px;">
                      🌐 管道一：至 Daily Diet 官方網頁（推薦）
                    </div>
                    <div style="font-size: 13.5px; color: #334155; line-height: 1.6;">
                      直接前往 <a href="https://winnie-lin.space/daily-diet/" target="_blank" style="color: #2563EB; font-weight: bold; text-decoration: underline;">Daily Diet 官方網頁</a> ➔ 點擊【<b>設定 ⚙️ ➔ 創辦人通行證 / 支持專案</b>】（或意見回饋區下方的支持連結），即可查閱即時匯款帳號、TWQR 碼與隨喜建議方案，並能直接於網頁輸入「末 5 碼」一秒完成登記！
                    </div>
                  </td>
                </tr>
              </table>

              <!-- 管道 2: LINE 官方帳號 -->
              <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #FFFFFF; border: 1.5px solid #5EEAD4; border-radius: 12px; margin-bottom: 14px;">
                <tr>
                  <td style="padding: 16px;">
                    <div style="font-size: 15px; font-weight: bold; color: #0F766E; margin-bottom: 6px;">
                      💬 管道二：在 LINE 官方帳號回覆「贊助」
                    </div>
                    <div style="font-size: 13.5px; color: #334155; line-height: 1.6;">
                      如果您有加入 Daily Diet 的 LINE 官方帳號，只要在聊天室傳送「<b>贊助</b>」或「<b>支持</b>」，熊貓教練就會立即推播專屬匯款卡片與 QR Code，點擊按鈕還能直接呼叫鍵盤快速回報「末 5 碼」！
                    </div>
                  </td>
                </tr>
              </table>

              <div style="background-color: #CCFBF1; border: 1px solid #5EEAD4; border-radius: 10px; padding: 12px 14px; font-size: 13px; color: #0F766E; line-height: 1.6; font-weight: bold; text-align: center;">
                ✨ 完成轉帳並於網頁或 LINE 回報末 5 碼後，系統會自動將您的信箱登記為【創始支持者】，立即享有永久專屬特權！
              </div>
            </td>
          </tr>
        </table>
      `;
    } else if (currentTemplate === 'gist_tech') {
      headerTitle = 'Daily Diet 雲端同步與 GitHub Gist / PAT 設定說明 🛠️';
      closingWish = '若您在配置或資料同步上有任何疑問，非常歡迎隨時回信與我交流！<br><b>祝您備份順暢、健康生活每一天！🛠️🐼</b>';
      bodyHtml = `
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #EFF6FF; border: 2px solid #000000; border-radius: 14px; margin-bottom: 24px;">
          <tr>
            <td style="padding: 20px;">
              <div style="font-size: 16px; font-weight: bold; color: #1E40AF; margin-bottom: 12px;">
                🛠️ 針對 Gist 與 PAT 同步的解答說明
              </div>
              <div style="font-size: 14px; color: #1E3A8A; line-height: 1.6;">
                <p style="margin: 0 0 10px 0;"><b>1. 為什麼會提示需要 PAT？</b><br>
                系統原生設計為免 PAT 智慧雲端同步。若前端直連 GitHub 官方 REST API，才會觸發此安全提示。</p>
                <p style="margin: 0 0 10px 0;"><b>2. PAT 在哪裡配置？</b><br>
                最新版本已在「設定 ⚙️ ➜ 備份同步」分頁最下方新增【⚙️ 進階設定：自訂個人 GitHub PAT】折疊面板。貼上 token 即可直連個人的 GitHub！</p>
                <p style="margin: 0;"><b>3. 系統預期檔名：</b><br>
                正是 <code style="background-color: #DBEAFE; padding: 2px 6px; border-radius: 4px; font-family: monospace;">daily-diet-backup.json</code>！包含餐點、分類、自訂目標與體重數據。</p>
              </div>
            </td>
          </tr>
        </table>
      `;
    } else {
      headerTitle = '非常感謝您對 Daily Diet 的寶貴建議與支持 ✨';
      closingWish = '再次感謝您撥冗給予寶貴建議，我們會持續努力將體驗打磨得更順手！<br><b>祝您飲食紀錄順心、健康生活每一天！✨🐼</b>';
      bodyHtml = `
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #ECFDF5; border: 2px solid #000000; border-radius: 14px; margin-bottom: 24px;">
          <tr>
            <td style="padding: 20px;">
              <div style="font-size: 16px; font-weight: bold; color: #065F46; margin-bottom: 8px;">
                🌱 持續迭代與進化
              </div>

  function renderPreview() {
    document.getElementById('previewArea').innerHTML = generateHtml();
  }

  async function copyRichHtml() {
    try {
      const html = generateHtml();
      const plain = generatePlain();
      const blobHtml = new Blob([html], { type: 'text/html' });
      const blobPlain = new Blob([plain], { type: 'text/plain' });

      if (navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([
          new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobPlain })
        ]);
      } else {
        await navigator.clipboard.writeText(plain);
      }
      showToast('🎉 精美排版信件已複製！在 Gmail 撰寫處按 Ctrl + V (貼上) 即可！');
    } catch (e) {
      navigator.clipboard.writeText(generatePlain());
      showToast('📄 已複製純文字版本！');
    }
  }

  function copyPlainText() {
    navigator.clipboard.writeText(generatePlain());
    showToast('📄 已複製純文字內容！');
  }

  function openGmail() {
    const data = getFormData();
    const to = encodeURIComponent(data.email);
    const su = encodeURIComponent(data.subject);
    const body = encodeURIComponent(generatePlain());
    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${su}&body=${body}`, '_blank');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3500);
  }
</script>

name: Deploy to Google Apps Script

on:
  push:
    paths:
      - 'gas/**'
      - 'scripts/deploy-gas.js'
      - '.github/workflows/deploy-gas.yml'
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install @google/clasp
        run: npm install -g @google/clasp

      - name: Configure clasp auth & scriptId
        if: "${{ secrets.CLASPRC_JSON != '' }}"
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          if [ -n "${{ secrets.GAS_SCRIPT_ID }}" ]; then
            if [ -f .clasp.json ]; then
              node -e '
                const fs = require("fs");
                const cfg = JSON.parse(fs.readFileSync(".clasp.json", "utf8"));
                cfg.scriptId = "${{ secrets.GAS_SCRIPT_ID }}";
                if ("${{ secrets.GAS_DEPLOYMENT_ID }}") cfg.deploymentId = "${{ secrets.GAS_DEPLOYMENT_ID }}";
                fs.writeFileSync(".clasp.json", JSON.stringify(cfg, null, 2));
              '
            else
              echo '{"scriptId":"${{ secrets.GAS_SCRIPT_ID }}","rootDir":"./gas"}' > .clasp.json
            fi
          fi

      - name: Deploy to Google Apps Script (Locking Deployment ID)
        if: "${{ secrets.CLASPRC_JSON != '' }}"
        run: |
          node scripts/deploy-gas.js

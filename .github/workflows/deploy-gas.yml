name: Deploy to Google Apps Script

on:
  push:
    paths:
      - 'gas/**'
      - '.github/workflows/deploy-gas.yml'
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install @google/clasp
        run: npm install -g @google/clasp

      - name: Configure clasp auth & scriptId
        if: "${{ secrets.CLASPRC_JSON != '' }}"
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          if [ -n "${{ secrets.GAS_SCRIPT_ID }}" ]; then
            echo '{"scriptId":"${{ secrets.GAS_SCRIPT_ID }}","rootDir":"./gas"}' > .clasp.json
          fi

      - name: Push to Google Apps Script
        if: "${{ secrets.CLASPRC_JSON != '' }}"
        run: |
          clasp push --force
          clasp deploy --description "Auto deployed via GitHub Actions $(date +'%Y-%m-%d %H:%M:%S')"
